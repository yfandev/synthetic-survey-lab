# What a model costs, in US dollars per million tokens, for the providers whose replies give only token
# counts: Anthropic's and OpenAI's own APIs, and Fireworks. OpenRouter and the Decisions API report each call's cost
# themselves, so their models are not here.
#
# `cache_write` is the price of a token written to the prompt cache, `cache_read` of one read from it; a
# model without one of them prices those tokens as input. `long` is what a prompt over `above` tokens,
# cache reads and writes included, pays instead.
#
# Standard tier, default routing: the harness asks for no batch, priority, fast mode or regional processing,
# which are priced otherwise. It writes Anthropic's 5-minute cache and OpenAI's default 30-minute one, so
# those are the write prices here. A dated snapshot (claude-opus-4-5-20251101, gpt-5.5-2026-04-23) takes
# its model's price. Check the prices against the pages below when a model is added or a price changes.

# https://platform.claude.com/docs/en/about-claude/pricing, read 2026-11-09. Opus 5.5 and Sonnet 5.5 read
# their cache at 0.05x input, Fable 5.2 and 5.1 at 0.025x, the rest at 0.1x.

